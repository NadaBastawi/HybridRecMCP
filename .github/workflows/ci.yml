name: CI
on:
  push:
    branches: [main, feature/streamlit-cloud-ready]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.lock'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m compileall -q main.py server.py demo.py domain.py train.py model_store.py explanations.py scripts monitoring
      - run: sh -n scripts/azure_start.sh
      - run: python generate_data.py
      - name: Check deterministic shipped dataset
        run: git diff --exit-code -- data/
      - run: python -m pytest --cov=. --cov-branch --cov-report=xml --cov-report=term-missing
      - run: python evaluate.py --output reports/evaluation.json
      - name: Check deterministic evaluation
        run: git diff --exit-code -- reports/evaluation.json
      - run: python train.py
      - name: Execute EDA notebook
        run: python scripts/check_notebook.py
      - name: Optional Codecov upload
        if: ${{ vars.CODECOV_ENABLED == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            reports/evaluation.json
            coverage.xml
  streamlit-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-demo.lock
      - name: Install exactly what Community Cloud selects for demo.py
        run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Fresh source, warm restart, invalid cache, both regions and recommendation flows
        run: python scripts/check_streamlit_readiness.py
      - uses: actions/upload-artifact@v4
        with:
          name: streamlit-readiness
          path: reports/streamlit_readiness.json
  container:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hybridrecmcp:test .
      - name: Start and health-check container
        shell: bash
        run: |
          docker run -d --name hybrid-demo -p 127.0.0.1:8000:8000 -e API_KEY="$(openssl rand -hex 32)" hybridrecmcp:test
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs hybrid-demo
          exit 1
      - if: always()
        run: docker rm -f hybrid-demo || true
