# Manual only: requires an existing App Service and separately configured Azure OIDC.
name: Manual Azure App Service deployment
on:
  workflow_dispatch:
    inputs:
      authorize_deploy:
        description: 'Deploy this revision to the configured Azure App Service'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ inputs.authorize_deploy }}
    runs-on: ubuntu-latest
    environment: azure-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Check external configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_WEBAPP_NAME; do
            if [ -z "${!key}" ]; then echo "::error::Missing external configuration: $key"; exit 1; fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m pip check
      - run: python train.py
      - name: Package source for Oryx build
        run: python scripts/package_backend.py --output release.zip
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        id: webapp
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release.zip
          startup-command: 'sh scripts/azure_start.sh'
      - name: Verify deployed readiness and protected routes
        env:
          WEBAPP_URL: ${{ steps.webapp.outputs.webapp-url }}
        run: python scripts/check_backend_health.py
